# ttyGS0 (USB serial gadget) accepts no output while no USB host is
# connected: writes block. systemd resets a getty's terminal, writing to it
# while it holds the console lock, so with nothing plugged into the OTG port
# systemd itself would hang. Leave the terminal alone; agetty just waits for
# a host to connect.
[Service]
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
