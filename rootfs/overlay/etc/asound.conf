# ReSpeaker Core v2 sound card "seeed8micvoicec":
#   hw:0,0  capture, 8 channels: 6 microphones + 2 loopback of the output
#   hw:0,1  playback, stereo: headphone jack and speaker
#
# Both share one I2S bus and must run at the same rate, so both are opened
# at 48 kHz through dmix/dsnoop. Several programs can then play and record
# at once, at any rate and format (converted by "plug").
#
#   arecord -c 8 -r 16000 -f S16_LE mics.wav     all channels
#   aplay music.wav                              speaker / jack
#   alsamixer                                    output volume, mic gains

pcm.!default {
	type asym
	playback.pcm "speaker"
	capture.pcm "mics"
}

ctl.!default {
	type hw
	card seeed8micvoicec
}

# Stereo output; its level is the codec's "Playback Volume"
pcm.speaker {
	type plug
	slave.pcm "speaker_dmix"
}

pcm.speaker_dmix {
	type dmix
	ipc_key 5978101
	ipc_perm 0666
	slave {
		pcm "hw:seeed8micvoicec,1"
		rate 48000
		channels 2
		format S32_LE
		period_size 1024
		buffer_size 4096
	}
}

# The 8 microphone-array channels
pcm.mics {
	type plug
	slave.pcm "mics_dsnoop"
}

pcm.mics_dsnoop {
	type dsnoop
	ipc_key 5978102
	ipc_perm 0666
	slave {
		pcm "hw:seeed8micvoicec,0"
		rate 48000
		channels 8
		format S32_LE
		period_size 1024
		buffer_size 4096
	}
}
